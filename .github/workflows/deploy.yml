name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: soyeon-kim-portfolio/package-lock.json

      - name: Install
        working-directory: soyeon-kim-portfolio
        run: npm ci

      - name: Build
        working-directory: soyeon-kim-portfolio
        run: npm run build

      # ✅ 추가: dist에 index.html이 없으면 여기서 실패하게 함
      - name: Verify dist output
        run: |
          ls -la soyeon-kim-portfolio
          ls -la soyeon-kim-portfolio/dist
          test -f soyeon-kim-portfolio/dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: soyeon-kim-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
